<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petal-PH | Messages</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="dashboard.html"><img class="brand-logo" src="logo.svg" alt="Petal-PH logo">Petal-PH</a>
    <div class="user-chip">
      <button class="icon-btn" title="Messages" aria-label="Messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.3 6.5-.1 1-.6 2.4-1.6 3.4 1.9.1 3.6-.6 4.7-1.4 1.1.3 2.3.5 3.6.5 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
      </button>
      <img id="avatarImg" class="avatar hidden" alt="Profile picture">
      <span id="avatarFallback" class="avatar avatar-fallback">U</span>
      <span id="userName" class="muted"></span>
      <button class="burger" id="backBtn" aria-label="Back to dashboard">&#8592;</button>
    </div>
  </header>

  <main class="chat-shell">
    <aside class="chat-contact">
      <img src="logo.svg" class="avatar" alt="Petal-PH Admin" style="background:#fff4f6">
      <div>
        <strong>Petal-PH Admin</strong>
        <div class="muted">Customer support — typically replies fast</div>
      </div>
      <ul class="chat-tips">
        <li>Ask about products and prices</li>
        <li>Follow up on your orders</li>
        <li>Get help with payments or delivery</li>
      </ul>
    </aside>

    <section class="chat-main">
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-input">
        <input id="chatText" placeholder="Message Petal-PH Admin..." autocomplete="off" required>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
    await PetalApp.init();
    const session = PetalApp.requireAuth('user');
    if (!session) throw new Error('Unauthorized');
    let user = PetalApp.getMyProfile();
    if (!user) {
      await PetalApp.reload();
      user = PetalApp.getMyProfile();
    }
    if (!user) { PetalApp.logout(); }

    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

    const img = document.getElementById('avatarImg');
    const fb = document.getElementById('avatarFallback');
    if (user.avatar) { img.src = user.avatar; img.classList.remove('hidden'); fb.classList.add('hidden'); }
    else { fb.textContent = (user.nickname || 'U').charAt(0).toUpperCase(); }
    document.getElementById('userName').textContent = user.nickname || '';

    const box = document.getElementById('chatMessages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatText');

    function fmtTime(iso) {
      const d = new Date(iso);
      const today = new Date().toDateString() === d.toDateString();
      return today
        ? d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' })
        : d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
    }

    function renderChat() {
      const mine = PetalApp.getMessages();
      if (!mine.length) {
        box.innerHTML = '<div class="chat-empty">No messages yet. Say hello to Petal-PH Admin — ask about flowers, orders, or delivery.</div>';
        return;
      }
      box.innerHTML = mine.map(m => `
        <div class="msg-row ${m.sender === 'user' ? 'mine' : 'them'}">
          <div class="bubble">${PetalApp.escapeHtml(m.body)}<span class="time">${fmtTime(m.created_at)}</span></div>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      await PetalApp.markRead(user.id, 'user');
      await PetalApp.loadOwn();
      renderChat();
    }

    let sendBusy = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sendBusy) return;
      const text = input.value;
      if (!text.trim()) return;
      const sendBtn = form.querySelector('button[type="submit"]');
      sendBusy = true;
      if (sendBtn) sendBtn.disabled = true;
      let res;
      try {
        res = await PetalApp.sendMessage(user.id, 'user', text);
      } finally {
        sendBusy = false;
        if (sendBtn) sendBtn.disabled = false;
      }
      if (!res.ok) { alert(res.message || 'Could not send message.'); return; }
      input.value = '';
      await poll();
    });

    await poll();
    setInterval(() => { poll().catch(err => console.warn('Petal-PH: chat poll failed', err)); }, 5000);
    })();
  </script>
</body>
</html>
